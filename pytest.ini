[pytest]
# Only collect this project's own tests. Without this, a bare `pytest` walks
# into the PyInstaller build output (release/_internal/torch/testing/...,
# build-release/, dist-release/, PixelFlow-*-Windows/) and the venv, and fails
# collecting ~90 third-party test modules.
testpaths = tests
norecursedirs =
    .git
    .venv
    venv
    __pycache__
    release
    build
    build-release
    dist
    dist-release
    PixelFlow-*
    vendor
    models
    outputs
    uploads
    workflows
markers =
    gpu: needs a CUDA GPU (skipped elsewhere); run on the RTX 5080 before a release (docs/BUILD.md)
# New deprecations in PixelFlow's own code fail the run instead of piling up
# as warnings (report item T6). Third-party deprecation warnings stay warnings.
filterwarnings =
    error::DeprecationWarning:backend.*
    error::PendingDeprecationWarning:backend.*
