<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PixelFlow</title>
  <link rel="stylesheet" href="vendor/litegraph.css" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div id="topbar">
    <div class="brand">PixelFlow</div>
    <button id="btn-queue" class="primary">Queue Prompt</button>
    <button id="btn-example">Load Example</button>
    <button id="btn-clear">Clear</button>
    <span class="sep"></span>
    <button id="btn-undo" title="Ctrl+Z">Undo</button>
    <button id="btn-redo" title="Ctrl+Y">Redo</button>
    <button id="btn-fit-view" title="Fit graph to view">Fit View</button>
    <span class="sep"></span>
    <button id="btn-save-workflow">Save Workflow</button>
    <select id="workflow-select"><option value="">Load workflow...</option></select>
    <button id="btn-export">Export JSON</button>
    <label class="file-btn">Import JSON<input id="file-import" type="file" accept="application/json" /></label>
  </div>

  <div id="main">
    <aside id="sidebar">
      <h3>Node Library</h3>
      <input id="node-search" type="text" placeholder="Search nodes..." autocomplete="off" />
      <div id="node-list"></div>
      <div id="node-search-empty" class="hidden">No nodes match your search.</div>
    </aside>

    <div id="canvas-wrap">
      <canvas id="graph-canvas"></canvas>
      <div id="empty-state">
        <p>Your graph is empty.</p>
        <p>Right-click the canvas to add a node, or click <strong>Load Example</strong> above to get started.</p>
      </div>
      <div id="progress-wrap" class="hidden">
        <div id="progress-label"></div>
        <div id="progress-track"><div id="progress-fill"></div></div>
      </div>
    </div>

    <aside id="rightpanel">
      <h3>Queue</h3>
      <div id="queue-list" class="panel-box"></div>
      <h3>Output Gallery</h3>
      <div id="gallery" class="panel-box"></div>
    </aside>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Save Workflow</h3>
      <input id="modal-input" type="text" placeholder="Workflow name" autocomplete="off" />
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm" class="primary">Save</button>
      </div>
    </div>
  </div>

  <div id="lightbox-overlay" class="lightbox-overlay hidden">
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script src="vendor/litegraph.min.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
