<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PixelFlow: two input nodes wired into an output node that holds a pixel grid (teal on slate). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16343d"/>
      <stop offset="1" stop-color="#0c1d23"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- wires -->
  <g fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round">
    <path d="M98 82 C130 82 120 112 150 112"/>
    <path d="M98 174 C130 174 120 144 150 144"/>
  </g>
  <!-- input nodes -->
  <rect x="34" y="56" width="64" height="52" rx="12" fill="#e6fffb"/>
  <rect x="34" y="148" width="64" height="52" rx="12" fill="#e6fffb"/>
  <circle cx="98" cy="82" r="9" fill="#2dd4bf"/>
  <circle cx="98" cy="174" r="9" fill="#2dd4bf"/>
  <!-- output node with a pixel grid -->
  <rect x="146" y="76" width="84" height="104" rx="14" fill="#e6fffb"/>
  <g>
    <rect x="156" y="96" width="20" height="20" rx="3" fill="#0f766e"/>
    <rect x="178" y="96" width="20" height="20" rx="3" fill="#2dd4bf"/>
    <rect x="200" y="96" width="20" height="20" rx="3" fill="#99f6e4"/>
    <rect x="156" y="118" width="20" height="20" rx="3" fill="#2dd4bf"/>
    <rect x="178" y="118" width="20" height="20" rx="3" fill="#ffd23c"/>
    <rect x="200" y="118" width="20" height="20" rx="3" fill="#2dd4bf"/>
    <rect x="156" y="140" width="20" height="20" rx="3" fill="#99f6e4"/>
    <rect x="178" y="140" width="20" height="20" rx="3" fill="#2dd4bf"/>
    <rect x="200" y="140" width="20" height="20" rx="3" fill="#0f766e"/>
  </g>
  <circle cx="146" cy="128" r="9" fill="#2dd4bf"/>
</svg>
