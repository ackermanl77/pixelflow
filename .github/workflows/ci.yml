name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this same suite before it builds anything.
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          # The shipped configuration: releases are built on Windows with Python 3.14.
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      # The real-pipeline tests fail (instead of skipping) when the tiny test checkpoint can't be
      # downloaded, so a green run always includes diffusion coverage (tests/_hub.py).
      PIXELFLOW_REQUIRE_HUB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      # Install the CPU-only torch wheel first so requirements.txt's torch requirement is already
      # satisfied and pip doesn't pull the multi-GB CUDA build onto a GPU-less runner. torchvision
      # (spandrel needs it) comes from the same index: Linux PyPI's torchvision is built for the
      # CUDA torch and fails to import next to the CPU one ("operator torchvision::nms does not exist").
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest httpx

      # Cache the tiny test checkpoint (hf-internal-testing/tiny-stable-diffusion-torch) the
      # real-pipeline tests download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-sd-v1-${{ runner.os }}

      # -rs lists every skipped test and why (e.g. the `gpu` tests on these GPU-less runners).
      - name: Run tests
        run: python -m pytest -q -rs

  # Frontend tooling (report item T3): ESLint, the node:test unit tests and a
  # Playwright smoke test against the backend in test mode (PIXELFLOW_TEST_MODE:
  # no torch, no models), so only the web dependencies are installed here.
  frontend:
    runs-on: ubuntu-latest
    env:
      PIXELFLOW_PYTHON: python
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install "fastapi==0.115.*" "uvicorn[standard]==0.32.*" "pillow>=11,<13" "python-multipart==0.0.*"
          npx playwright install --with-deps chromium

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Playwright smoke test
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  audit:
    # Known vulnerabilities in the pinned/required Python packages (OSV / PyPI advisory data).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-lock.txt --progress-spinner off
